name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test
    # NOTE: WPF requires Windows. Update runner to windows-latest once the
    # repo is connected to GitHub Actions and Windows runners are available.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WarehousePOS.sln

      - name: Build (treat warnings as errors)
        run: dotnet build WarehousePOS.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test WarehousePOS.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'

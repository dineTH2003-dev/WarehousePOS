name: Bug Report
description: Report a bug or unexpected behaviour in WarehousePOS
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in all required fields below so the team can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Affected Layer
      description: Which layer of the application is most likely responsible?
      options:
        - Domain
        - Application
        - Infrastructure
        - Desktop / UI
        - Database / Migration
        - Printing
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical — application crashes or data loss
        - High — feature is broken and unusable
        - Medium — feature works but behaves incorrectly
        - Low — minor visual or cosmetic issue
    validations:
      required: true

  - type: textarea
    id: technical_support
    attributes:
      label: 🔧 Technical Support / Fix Hints
      description: |
        Optional but encouraged. If you know the likely cause or have a suggested approach to fixing this,
        describe it here. Reference specific files, classes, methods, or patterns in the codebase.
      placeholder: |
        - The issue is likely in `src/WarehousePOS.Desktop/ViewModels/...`
        - The ViewModel property is not resetting because ...
        - Suggested fix: call Reset() before opening the form
    validations:
      required: false

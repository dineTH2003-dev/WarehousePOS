name: Feature Request / Enhancement
description: Suggest a new feature or improvement to an existing one
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose new features or enhancements to WarehousePOS.
        Please be as specific as possible so the team can evaluate and implement it correctly.

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which part of the application does this feature relate to?
      options:
        - Authentication & User Management
        - Product & Category Management
        - Supplier Management
        - Purchase Orders
        - Inventory & Stock Movements
        - POS & Sales
        - Payments & Discounts
        - Invoices & Billing
        - Printing (Receipts / POs)
        - Customers
        - Employees & Payroll
        - Expenses
        - Reports & Analytics
        - Backup & Audit
        - UI / UX Improvement
        - Performance
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High — blocks important workflow
        - Medium — improves existing workflow
        - Low — nice to have
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be built or changed? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define exactly what "done" looks like. Use checkboxes.
      placeholder: |
        - [ ] User can do X
        - [ ] System validates Y
        - [ ] Data is saved as Z
    validations:
      required: true

  - type: textarea
    id: affected_layers
    attributes:
      label: Affected Layers
      description: Which layers will need changes? (Domain / Application / Infrastructure / Desktop)
      placeholder: |
        - Desktop: new form / ViewModel
        - Application: new use-case / DTO
        - Infrastructure: new repository method (if schema changes, add a migration)
    validations:
      required: false

  - type: textarea
    id: technical_support
    attributes:
      label: 🔧 Technical Support / Implementation Hints
      description: |
        Optional but encouraged. Describe suggested implementation approaches, relevant existing
        classes, patterns to follow, or anything that helps the developer get started quickly.
      placeholder: |
        - Follow the same pattern as `AddProductUseCase` in Application layer
        - The new ViewModel should live at `WarehousePOS.Desktop/ViewModels/...`
        - Remember to wrap DB changes in a transaction if multiple tables are updated
    validations:
      required: false
